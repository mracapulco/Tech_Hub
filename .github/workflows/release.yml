name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v tag="$VERSION" '
            index($0, "## [" tag "]") == 1 {found=1; print; next}
            found && index($0, "## [") == 1 {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "Release notes for ${TAG} not found in CHANGELOG.md."
              echo
              echo "DEBUG: TAG=[$TAG] VERSION=[$VERSION]"
              echo "DEBUG: awk=$(command -v awk) $(awk --version 2>&1 | head -1)"
              echo "DEBUG: CHANGELOG.md bytes=$(wc -c < CHANGELOG.md) md5=$(md5sum CHANGELOG.md)"
              echo "DEBUG: line 7 of CHANGELOG.md follows (od -c, first 40 bytes):"
              sed -n '7p' CHANGELOG.md | od -c | head -5
            } > RELEASE_NOTES.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
